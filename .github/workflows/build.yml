# Builds listings.json from Clusterflick's licensed per-venue data plus TMDB film details, and
# publishes it with GitHub Pages. Nothing is committed to the repo.
name: Build listings

on:
  schedule:                     # times are UTC; GitHub may start scheduled runs late
    - cron: "40 6 * * *"        # after Clusterflick's morning rebuild
    - cron: "40 12 * * *"
    - cron: "40 17 * * *"       # after its afternoon rebuild
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]            # rebuild whenever the script changes

# GitHub pauses scheduled workflows in repos with no activity for 60 days. If that happens, press
# "Enable workflow" on the Actions tab (there is no keep-alive commit any more).

permissions:                    # what this workflow's own token may do
  contents: read                # check out the code; nothing is ever pushed
  pages: write                  # publish to GitHub Pages
  id-token: write               # proves to Pages that the deploy really comes from this repo

concurrency:                    # never run two deploys at once
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get Clusterflick's venue records
        run: |
          git clone --depth 1 https://github.com/clusterflick/scripts .cache/scripts
          node export_venues.js .cache/scripts/cinemas .cache/venues.json

      - name: Build listings.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}   # TMDB "API Read Access Token", set under Settings -> Secrets
        run: python build.py --venues .cache/venues.json --screenings .cache/screenings --out site
        # exits non-zero if the data looks wrong, which stops everything below

      - name: Hand the site folder to the deploy job
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build                # only runs if build succeeded, so a bad build leaves the last file live
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
