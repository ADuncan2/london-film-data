# Builds listings.json from Clusterflick's open data and publishes it with GitHub Pages.
name: Build listings

on:
  schedule:                     # times are UTC; GitHub may start scheduled runs late
    - cron: "40 6 * * *"        # after Clusterflick's morning rebuild
    - cron: "40 12 * * *"
    - cron: "40 17 * * *"       # after its afternoon rebuild
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]            # rebuild whenever the script changes

permissions:                    # what this workflow's own token may do
  contents: write               # commit the keep-alive stamp (see last job)
  pages: write                  # publish to GitHub Pages
  id-token: write               # proves to Pages that the deploy really comes from this repo

concurrency:                    # never run two deploys at once
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build listings.json
        run: python build.py --out site       # exits non-zero if the data looks wrong, which stops everything below
      - name: Hand the site folder to the deploy job
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build                # only runs if build succeeded, so a bad build leaves yesterday's file live
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keep-alive:
    # GitHub switches off scheduled workflows in repos with no commits for 60 days.
    # Publishing to Pages is not a commit, so once a month this job makes a tiny one.
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a stamp if the last commit is over 30 days old
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > last-run.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last-run.txt
            git commit -m "Keep scheduled workflow alive"
            git push
          fi
